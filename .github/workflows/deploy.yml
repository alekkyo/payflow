name: Deploy

# workflow_run fires when another workflow finishes. This means Deploy only
# starts after CI has completed — and the `if` below ensures it only proceeds
# if CI actually passed. Keeps CI and Deploy as separate workflow files
# (CI runs on PRs too; Deploy never should).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Prevent two deploys running at the same time (e.g. two quick pushes to main).
# cancel-in-progress: false queues the second deploy rather than killing the
# first mid-flight — safer for a payments system.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build · push · deploy
    runs-on: ubuntu-latest

    # Only run if the triggering CI workflow actually succeeded.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    # packages: write is required to push images to GHCR.
    # contents: read is the minimum needed to check out the repo.
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Log in to GitHub Container Registry using the auto-provisioned
      # GITHUB_TOKEN. No secret setup required — GitHub injects this token
      # into every workflow run automatically.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Buildx is Docker's extended build client. Required for the
      # cache-from/cache-to flags below that store layer cache in
      # GitHub Actions Cache — this is what makes rebuilds fast instead
      # of 5+ minutes.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the API image and push two tags:
      #   :latest        — what the server always pulls
      #   :<git-sha>     — immutable, lets you roll back to any exact commit
      #
      # cache-from/cache-to: type=gha stores Docker layer cache in GitHub's
      # cache service. On a cache hit, unchanged layers (e.g. go mod download)
      # are restored in seconds instead of re-downloading.
      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: |
            ghcr.io/alekkyo/payflow-api:latest
            ghcr.io/alekkyo/payflow-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.worker
          push: true
          tags: |
            ghcr.io/alekkyo/payflow-worker:latest
            ghcr.io/alekkyo/payflow-worker:${{ github.sha }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      # SSH into the production server and:
      # 1. git pull   — picks up any changes to compose files, nginx config, etc.
      # 2. docker compose pull — downloads the new :latest images from GHCR
      # 3. docker compose up -d — restarts only api and worker with zero postgres/redis downtime
      # 4. docker image prune — removes old image layers to free disk space
      #
      # Secrets needed (add in GitHub → Settings → Secrets → Actions):
      #   DEPLOY_HOST  — server IP or hostname
      #   DEPLOY_USER  — SSH user (e.g. root)
      #   DEPLOY_SSH_KEY — private key whose public key is in ~/.ssh/authorized_keys on the server
      - name: Deploy to production
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /var/www/payflow
            git pull --ff-only
            docker compose -f docker-compose.prod.yml pull api worker
            docker compose -f docker-compose.prod.yml up -d api worker
            docker image prune -f
